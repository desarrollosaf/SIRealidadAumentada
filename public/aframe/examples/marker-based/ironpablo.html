<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reconocimiento de mural</title>
  <style>
    #videoMural {
      display: none; /* Oculto por defecto */
      margin: 10px auto;
    }
    #video, #resultado {
      display: block;
      margin: 10px auto;
    }
    #canvas {
      display: none; /* oculto, solo lo usamos para procesar */
    }
  </style>
</head>
<body>
  <h1>Detector de mural con TensorFlow.js</h1>

  <!-- Cámara -->
  <video id="video" autoplay playsinline width="320" height="240"></video>
  <canvas id="canvas" width="224" height="224"></canvas> <!-- Tamaño ajustado -->

  <!-- Video a mostrar SOLO si se detecta mural -->
  <video id="videoMural" width="320" height="240" controls>
    <source src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/centro.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

  <div id="resultado"></div>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script>
    let model, metadata;

    async function init() {
      // Cargar modelo (ajusta la ruta según dónde lo pongas)
      model = await tf.loadLayersModel("https://sistemas.siasaf.gob.mx/aframe/examples/assets/model.json");

      // Cargar metadata (etiquetas de clases)
      const response = await fetch("https://sistemas.siasaf.gob.mx/aframe/examples/assets/metadata.json");
      metadata = await response.json();

      console.log("Modelo y metadata cargados");

      // Configurar cámara
      const video = document.getElementById("video");
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
        video.srcObject = stream;
      });

      video.addEventListener("loadeddata", predictLoop);
    }

    async function predictLoop() {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const resultadoDiv = document.getElementById("resultado");
      const videoMural = document.getElementById("videoMural");

      async function loop() {
        // Dibujar frame en canvas
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Convertir frame a tensor
        let tensor = tf.browser.fromPixels(canvas)
          .toFloat()
          .expandDims(0);

        // Predecir
        let prediction = await model.predict(tensor).data();

        // Buscar la clase con mayor probabilidad
        let maxIndex = prediction.indexOf(Math.max(...prediction));
        let label = metadata.labels[maxIndex];
        let score = prediction[maxIndex];

        // Mostrar resultado
        resultadoDiv.innerHTML = `Clase: ${label} <br> Confianza: ${(score * 100).toFixed(2)}%`;

        // Si detecta mural con alta confianza → mostrar video
        if (label === "mural" && score > 0.8) {
          videoMural.style.display = "block";
          if (videoMural.paused) videoMural.play();
        } else {
          if (!videoMural.paused) videoMural.pause();
          videoMural.style.display = "none";
        }

        requestAnimationFrame(loop);
      }

      loop();
    }

    init();
  </script>
</body>
</html>
