<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR Mural con Video</title>
  <!-- A-Frame + AR.js con soporte NFT -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://rawcdn.githack.com/AR-js-org/AR.js/3.4.2/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    video { display: none; }
  </style>
</head>
<body>
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- 🎨 Mural con marcador NFT -->
    <a-nft
      type="nft"
      url="https://sistemas.siasaf.gob.mx/aframe/examples/assets/pablo1"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-video
        src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/izquierda.mp4"
        width="1"
        height="0.56"
        autoplay
        loop
        muted
        position="0 0 0"
      ></a-video>
    </a-nft>

    <!-- Cámara AR.js -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
