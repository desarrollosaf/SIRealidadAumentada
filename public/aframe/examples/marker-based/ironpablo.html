<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>WebAR con Video</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.2/three.js/build/ar-threex.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas, video { position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <script src="main.js">
    // Crear escena, cámara y renderizador
const scene = new THREE.Scene();
const camera = new THREE.Camera();
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Configurar fuente de AR
const arSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });
arSource.init(() => setTimeout(() => onResize(), 2000));

window.addEventListener('resize', () => onResize());
function onResize() {
  arSource.onResizeElement();
  arSource.copyElementSizeTo(renderer.domElement);
  if (arContext.arController) {
    arSource.copyElementSizeTo(arContext.arController.canvas);
  }
}

// Configurar contexto AR
const arContext = new THREEx.ArToolkitContext({
  cameraParametersUrl: 'https://cdn.jsdelivr.net/npm/ar.js@3.4.2/data/data/camera_para.dat',
  detectionMode: 'mono'
});
arContext.init(() => camera.projectionMatrix.copy(arContext.getProjectionMatrix()));

// Crear marcador personalizado
const markerRoot = new THREE.Group();
scene.add(markerRoot);

const markerControls = new THREEx.ArMarkerControls(arContext, markerRoot, {
  type: 'pattern',
  patternUrl: 'https://sistemas.siasaf.gob.mx/aframe/examples/assets/pablo1.patt'
});

// Crear video como textura
const video = document.createElement('video');
video.src = 'https://sistemas.siasaf.gob.mx/aframe/examples/assets/izquierda.mp4';
video.crossOrigin = 'anonymous';
video.loop = true;
video.muted = true;
video.playsInline = true;
video.autoplay = true;
video.setAttribute('webkit-playsinline', 'true');
video.play();

const videoTexture = new THREE.VideoTexture(video);
const material = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
const geometry = new THREE.PlaneGeometry(1, 0.56);
const mesh = new THREE.Mesh(geometry, material);
mesh.position.set(0, 0, 0);
markerRoot.add(mesh);

// Loop de renderizado
function animate() {
  requestAnimationFrame(animate);
  if (arSource.ready) arContext.update(arSource.domElement);
  renderer.render(scene, camera);
}
animate();



  </script>
</body>
</html>
