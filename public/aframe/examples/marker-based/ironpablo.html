<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Mural Video</title>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0"></script>
</head>
<body>
  <video id="srcVideo" playsinline webkit-playsinline muted loop preload="auto">
    <source src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/izquierda.mp4" type="video/mp4" />
  </video>

  <img id="refImg" src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/pablo1.jpg" style="display:none" crossorigin="anonymous"/>
  <canvas id="analyzer" width="224" height="224" style="display:none"></canvas>

<script>
window.addEventListener('load', async () => {
  const mobilenetModel = await mobilenet.load({version: 2, alpha: 1.0});
  const refImg = document.getElementById('refImg');
  await new Promise(res => { if (refImg.complete) res(); else refImg.onload = res; });
  const refEmbedding = tf.tidy(() => mobilenetModel.infer(refImg, true).dataSync());

  function cosineSim(a, b) {
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
    return dot / (Math.sqrt(na)*Math.sqrt(nb) + 1e-8);
  }

  const analyzer = document.getElementById('analyzer');
  const actx = analyzer.getContext('2d');
  const cam = document.createElement('video');
  cam.setAttribute('playsinline', '');
  cam.muted = true;
  cam.style.display = 'none';
  document.body.appendChild(cam);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    cam.srcObject = stream;
    await cam.play();
  } catch(err) {
    alert('No se pudo acceder a la cámara: ' + err);
    return;
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera();
  scene.add(camera);

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
  scene.add(light);

  const videoEl = document.getElementById('srcVideo');
  const videoTex = new THREE.VideoTexture(videoEl);
  const planeGeom = new THREE.PlaneGeometry(1, 0.56);
  const planeMat = new THREE.MeshBasicMaterial({ map: videoTex, side: THREE.DoubleSide });
  const plane = new THREE.Mesh(planeGeom, planeMat);
  plane.visible = false;
  scene.add(plane);

  function placeInFront(distance = 1) {
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const pos = new THREE.Vector3().copy(camera.position).add(dir.multiplyScalar(distance));
    plane.position.copy(pos);
    plane.quaternion.copy(camera.quaternion);
  }

  function analyzeFrame() {
    const s = Math.min(cam.videoWidth, cam.videoHeight);
    const sx = (cam.videoWidth - s) / 2;
    const sy = (cam.videoHeight - s) / 2;
    actx.drawImage(cam, sx, sy, s, s, 0, 0, 224, 224);
    const frameTensor = tf.browser.fromPixels(analyzer);
    const emb = mobilenetModel.infer(frameTensor, true).dataSync();
    frameTensor.dispose();
    return cosineSim(refEmbedding, emb);
  }

  let detected = false;
  function renderLoop() {
    const sim = analyzeFrame();
    if (sim > 0.8 && !detected) {
      detected = true;
      plane.visible = true;
      placeInFront(1.0);
      videoEl.play().catch(()=>{});
    }
    renderer.render(scene, camera);
  }

  // Crear botón ARButton automáticamente
  document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: [] }));
  renderer.setAnimationLoop(renderLoop);
});
</script>
</body>
</html>
