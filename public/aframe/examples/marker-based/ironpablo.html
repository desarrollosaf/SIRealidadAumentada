<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reconocimiento de mural</title>
  <style>
    #videoMural {
      display: none; /* Oculto por defecto */
      margin: 10px auto;
    }
    #video, #resultado {
      display: block;
      margin: 10px auto;
    }
  </style>
</head>
<body>
  <h1>Detector de mural con MediaPipe</h1>

  <!-- Cámara -->
  <video id="video" autoplay playsinline width="320" height="240"></video>

  <!-- Video a mostrar SOLO si se detecta mural -->
  <video id="videoMural" width="320" height="240" controls>
    <source src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/centro.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

  <div id="resultado"></div>

  <script type="module">
    import { ImageClassifier } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

    async function init() {
      // Cargar modelo TFLite
      const classifier = await ImageClassifier.createFromOptions({
        baseOptions: {
          modelAssetPath: "https://sistemas.siasaf.gob.mx/aframe/examples/assets/model_unquant.tflite"
        }
      });

      // Configurar cámara
      const video = document.getElementById("video");
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
        video.srcObject = stream;
      });

      const videoMural = document.getElementById("videoMural");
      const resultadoDiv = document.getElementById("resultado");

      video.addEventListener("loadeddata", async () => {
        async function loop() {
          const result = await classifier.classify(video);

          if (result.classifications.length > 0) {
            const top = result.classifications[0].categories[0];

            // Mostrar predicción en texto
            resultadoDiv.innerHTML = `Clase: ${top.categoryName} <br> Confianza: ${(top.score * 100).toFixed(2)}%`;

            if (top.categoryName === "mural" && top.score > 0.8) {
              // Si detecta mural -> mostrar y reproducir video
              videoMural.style.display = "block";
              if (videoMural.paused) videoMural.play();
            } else {
              // Si no detecta mural -> ocultar y pausar video
              if (!videoMural.paused) videoMural.pause();
              videoMural.style.display = "none";
            }
          }

          requestAnimationFrame(loop);
        }
        loop();
      });
    }

    init();
  </script>
</body>
</html>
