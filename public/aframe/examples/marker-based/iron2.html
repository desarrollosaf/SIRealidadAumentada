<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MindAR Video Estable</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.body,
    imageTargetSrc: "https://sistemas.siasaf.gob.mx/aframe/examples/assets/targetsIC.mind" // tu archivo .mind
  });

  const { renderer, scene, camera } = mindarThree;

  // Crear video
  const video = document.createElement("video");
  video.src = "https://sistemas.siasaf.gob.mx/aframe/examples/assets/centro.mp4"; // tu video
  video.crossOrigin = "anonymous";
  video.loop = true;
  video.muted = true;
  video.playsInline = true;

  const texture = new THREE.VideoTexture(video);
  const geometry = new THREE.PlaneGeometry(1.8, 1.0); // más grande que 1x0.5
  const material = new THREE.MeshBasicMaterial({ map: texture });
  const plane = new THREE.Mesh(geometry, material);

  const anchor = mindarThree.addAnchor(0);
  anchor.group.add(plane);

  // Dead zone + suavizado
  let lastPosition = new THREE.Vector3();
  let lastQuaternion = new THREE.Quaternion();
  const deadZonePos = 0.005;   // cuanto más alto, menos temblores
  const deadZoneRot = 0.005;
  const smoothFactor = 0.2;    // 0 = no suavizado, 1 = muy lento

  anchor.onTargetFound = () => {
    video.play();
  };
  anchor.onTargetLost = () => {
    video.pause();
  };

  const clock = new THREE.Clock();

  renderer.setAnimationLoop(() => {
    const delta = clock.getDelta();

    // Si el ancla está visible
    if (anchor.group.visible) {
      const currentPos = anchor.group.position.clone();
      const currentQuat = anchor.group.quaternion.clone();

      // Comparar posición con última
      if (currentPos.distanceTo(lastPosition) > deadZonePos) {
        lastPosition.lerp(currentPos, smoothFactor);
        anchor.group.position.copy(lastPosition);
      } else {
        anchor.group.position.copy(lastPosition);
      }

      // Comparar rotación
      if (1 - Math.abs(currentQuat.dot(lastQuaternion)) > deadZoneRot) {
        lastQuaternion.slerp(currentQuat, smoothFactor);
        anchor.group.quaternion.copy(lastQuaternion);
      } else {
        anchor.group.quaternion.copy(lastQuaternion);
      }
    }

    renderer.render(scene, camera);
  });

  mindarThree.start();
});
</script>
</body>
</html>
