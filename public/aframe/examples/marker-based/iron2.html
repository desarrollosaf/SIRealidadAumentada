<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // Control de video
      AFRAME.registerComponent("video-handler", {
        schema: { target: { type: "selector" } },
        init: function () {
          const video = this.data.target;

          const unlock = () => {
            video.play().then(() => {
              video.pause();
            }).catch(e => console.log("Error al desbloquear video:", e));
            window.removeEventListener("touchstart", unlock);
          };
          window.addEventListener("touchstart", unlock, { once: true });

          this.el.addEventListener("targetFound", () => { video.play(); });
          this.el.addEventListener("targetLost", () => { video.pause(); });
        }
      });

      // Suavizado interno del objeto
      AFRAME.registerComponent('smooth-position', {
        tick: function () {
          const targetPos = this.el.object3D.position;
          const targetRot = this.el.object3D.rotation;

          if (!this.lastPos) {
            this.lastPos = targetPos.clone();
            this.lastRot = targetRot.clone();
          }

          this.lastPos.lerp(targetPos, 0.15); // suavizado
          this.lastRot.x += (targetRot.x - this.lastRot.x) * 0.15;
          this.lastRot.y += (targetRot.y - this.lastRot.y) * 0.15;
          this.lastRot.z += (targetRot.z - this.lastRot.z) * 0.15;

          this.el.object3D.position.copy(this.lastPos);
          this.el.object3D.rotation.copy(this.lastRot);
        }
      });
    </script>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: https://sistemas.siasaf.gob.mx/aframe/examples/assets/targetsIC.mind; filterMinCF: 0.0001; filterBeta: 10;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="video1" src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/centro.mp4" loop muted playsinline preload="auto" crossorigin="anonymous"></video>
        <video id="video2" src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/izquierda.mp4" loop muted playsinline preload="auto" crossorigin="anonymous"></video>
        <video id="video3" src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/derecha.mp4" loop muted playsinline preload="auto" crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Marcador 0 -->
      <a-entity mindar-image-target="targetIndex: 0" video-handler="target: #video2">
        <a-plane material="shader: flat; src: #video2" width="0.8" height="1.4" smooth-position></a-plane>
      </a-entity>

      <!-- Marcador 1 -->
      <a-entity mindar-image-target="targetIndex: 1" video-handler="target: #video1">
        <a-plane material="shader: flat; src: #video1" width="0.8" height="1.4" smooth-position></a-plane>
      </a-entity>

      <!-- Marcador 2 -->
      <a-entity mindar-image-target="targetIndex: 2" video-handler="target: #video3">
        <a-plane material="shader: flat; src: #video3" width="0.8" height="1.4" smooth-position></a-plane>
      </a-entity>
  
    </a-scene>
  </body>
</html>
