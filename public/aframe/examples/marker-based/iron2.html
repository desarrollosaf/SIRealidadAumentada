<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // Control de video
      AFRAME.registerComponent("video-handler", {
        schema: { target: { type: "selector" } },
        init: function () {
          const video = this.data.target;

          const unlock = () => {
            video.play().then(() => {
              video.pause();
            }).catch(e => console.log("Error al desbloquear video:", e));
            window.removeEventListener("touchstart", unlock);
          };
          window.addEventListener("touchstart", unlock, { once: true });

          this.el.addEventListener("targetFound", () => { video.play(); });
          this.el.addEventListener("targetLost", () => { video.pause(); });
        }
      });

      // Componente para zona muerta (dead zone)
      AFRAME.registerComponent('stable-video', {
        schema: { target: { type: 'selector' }, threshold: { type: 'number', default: 0.003 } },
        init: function () {
          this.lastPos = new THREE.Vector3();
          this.lastRot = new THREE.Euler();
          this.isFirstUpdate = true;
        },
        tick: function () {
          if (!this.data.target) return;
          const targetObj = this.data.target.object3D;
          const obj = this.el.object3D;

          if (this.isFirstUpdate) {
            this.lastPos.copy(targetObj.position);
            this.lastRot.copy(targetObj.rotation);
            obj.position.copy(this.lastPos);
            obj.rotation.copy(this.lastRot);
            this.isFirstUpdate = false;
            return;
          }

          // Distancia de movimiento
          const deltaPos = targetObj.position.clone().sub(this.lastPos).length();
          const deltaRot = Math.abs(targetObj.rotation.x - this.lastRot.x) +
                           Math.abs(targetObj.rotation.y - this.lastRot.y) +
                           Math.abs(targetObj.rotation.z - this.lastRot.z);

          // Solo actualiza si el cambio supera el umbral
          if (deltaPos > this.data.threshold || deltaRot > 0.002) {
            this.lastPos.copy(targetObj.position);
            this.lastRot.copy(targetObj.rotation);
          }

          obj.position.copy(this.lastPos);
          obj.rotation.copy(this.lastRot);
        }
      });
    </script>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: https://sistemas.siasaf.gob.mx/aframe/examples/assets/targetsIC.mind; filterMinCF: 0.0001; filterBeta: 10;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="video1" src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/centro.mp4" loop muted playsinline preload="auto" crossorigin="anonymous"></video>
        <video id="video2" src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/izquierda.mp4" loop muted playsinline preload="auto" crossorigin="anonymous"></video>
        <video id="video3" src="https://sistemas.siasaf.gob.mx/aframe/examples/assets/derecha.mp4" loop muted playsinline preload="auto" crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Marcador 0 -->
      <a-entity mindar-image-target="targetIndex: 0" id="marker0" video-handler="target: #video2"></a-entity>
      <a-entity stable-video="target: #marker0; threshold: 0.002">
        <a-plane material="shader: flat; src: #video2" width="0.8" height="1.4"></a-plane>
      </a-entity>

      <!-- Marcador 1 -->
      <a-entity mindar-image-target="targetIndex: 1" id="marker1" video-handler="target: #video1"></a-entity>
      <a-entity stable-video="target: #marker1; threshold: 0.002">
        <a-plane material="shader: flat; src: #video1" width="0.8" height="1.4"></a-plane>
      </a-entity>

      <!-- Marcador 2 -->
      <a-entity mindar-image-target="targetIndex: 2" id="marker2" video-handler="target: #video3"></a-entity>
      <a-entity stable-video="target: #marker2; threshold: 0.002">
        <a-plane material="shader: flat; src: #video3" width="0.8" height="1.4"></a-plane>
      </a-entity>
  
    </a-scene>
  </body>
</html>
